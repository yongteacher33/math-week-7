<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>이차부등식 과제</title><style>body{font:17px system-ui,"Malgun Gothic",sans-serif;max-width:720px;margin:24px auto;padding:14px;color:#172033;line-height:1.65}section{border:1px solid #ccd5e2;border-radius:12px;padding:20px;margin:14px 0}h1{font-size:1.5rem}.problem{font-size:1.5rem;padding:14px;background:#f3f6fb}li{padding:7px}button{font:inherit;padding:9px 14px;background:#244cb2;color:white;border:0;border-radius:8px}button:focus-visible{outline:3px solid #e0a000} @media(max-width:560px){body{margin:8px}}</style></head><body><h1>내 별명의 이차부등식 과제</h1><section><p>부등식의 해를 고르고 확인해 보세요. 두 근의 바깥과 사이에서 값을 넣어 부호를 확인하세요.</p><p class="problem">−2(x+2)(x−3) ≥ 0</p><fieldset><legend>해를 고르세요</legend><label><input type="radio" name="answer" value="1"> ① (−∞, −2] ∪ [3, +∞)</label><br><label><input type="radio" name="answer" value="2"> ② [−2, 3]</label><br><label><input type="radio" name="answer" value="3"> ③ (−2, 3)</label><br><label><input type="radio" name="answer" value="4"> ④ (−∞, 3]</label></fieldset><p>고른 보기: ____________________</p><p>풀이: ______________________________________________</p><button id="confirm">확인</button><p id="status" aria-live="polite"></p></section><p>공통수학1 이차부등식 · 중근·허근 예시는 다루지 않습니다.</p><script>document.getElementById('confirm').onclick=()=>{document.getElementById('status').textContent='선택을 마쳤어요. 선생님께 풀이를 보여 주세요.';document.getElementById('confirm').disabled=true}</script></body></html>
